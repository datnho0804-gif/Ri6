<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo trái sầu riêng Ri6">
  <!-- Background (#faf8f5) -->
  <rect width="512" height="512" fill="#faf8f5" />

  <!-- Durian fruit scaled bold (~80% height of canvas; ~68% inside maskable-512 safe circle) -->
  <g transform="translate(256 256) scale(1.13) translate(-256 -254)">
    <!-- Short sturdy basalt-red stem (#9a3412) tapering cleanly into crown -->
    <path
      d="M238 136 L245 86 C247 73 257 66 270 68 C282 70 288 80 284 93 L274 136 Z"
      fill="#9a3412"
      stroke="#14532d"
      stroke-width="15"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Upright tapered oval durian shell (#4d7c0f) with bold triangular outer spikes -->
    <path
      d="M256 122
         L292 140 L328 158 L334 190
         L378 224 L364 264
         L396 308 L358 344
         L346 392 L298 408
         L256 440
         L214 408 L166 392
         L154 344 L116 308
         L148 264 L134 224
         L178 190 L184 158 L220 140 Z"
      fill="#4d7c0f"
      stroke="#14532d"
      stroke-width="16"
      stroke-linejoin="round"
    />

    <!-- Carpel seam curve (#3f6212) -->
    <path
      d="M256 132 C226 218 224 318 256 426"
      fill="none"
      stroke="#3f6212"
      stroke-width="11"
      stroke-linecap="round"
    />

    <!-- 8 simple flat triangular thorns inside shell (#3f6212) -->
    <g fill="#3f6212">
      <polygon points="216,174 198,202 234,198" />
      <polygon points="282,168 266,194 300,192" />
      <polygon points="182,228 160,256 200,254" />
      <polygon points="228,242 208,272 244,270" />
      <polygon points="172,294 152,322 192,320" />
      <polygon points="218,312 198,342 236,340" />
      <polygon points="198,360 182,386 218,384" />
      <polygon points="256,376 240,404 274,404" />
    </g>

    <!-- Opened durian locule (múi bổ hé) with cream pith rim (#faf8f5) -->
    <path
      d="M288 202
         C344 204 378 244 374 302
         C370 358 326 396 276 392
         C254 390 248 364 252 306
         C256 246 262 202 288 202 Z"
      fill="#faf8f5"
      stroke="#14532d"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- Plump golden Ri6 durian aril (cơm vàng #fbbf24) -->
    <path
      d="M294 224
         C334 226 352 250 348 278
         C346 288 338 295 338 302
         C338 309 348 318 346 334
         C342 356 316 372 286 370
         C268 368 266 346 270 302
         C274 254 276 224 294 224 Z"
      fill="#fbbf24"
      stroke="#14532d"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- Subtle flat crease accentuating golden Ri6 flesh lobe -->
    <path
      d="M286 300 Q310 304 334 300"
      fill="none"
      stroke="#9a3412"
      stroke-width="8"
      stroke-linecap="round"
    />
  </g>
</svg>
